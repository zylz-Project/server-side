<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>登录 · Audio Hub</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-body">
  <main class="login-layout">
    <section class="login-visual" aria-label="Audio Hub">
      <div>
        <div class="login-brand"><span class="brand-mark" aria-hidden="true">A</span> Audio Hub</div>
        <h1>设备出厂工作台</h1>
        <p>在工厂局域网管理设备、离线音频和百炼 Key。</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <header>
          <span class="mobile-brand"><span class="brand-mark" aria-hidden="true">A</span> Audio Hub</span>
          <h1>管理员登录</h1>
        </header>

        <form id="login-form" class="form-stack" novalidate>
          <label class="field">
            <span>用户名</span>
            <span class="input-wrap">
              <svg class="input-icon" aria-hidden="true"><use href="#icon-user"></use></svg>
              <input id="username" name="username" autocomplete="username" value="admin" required>
            </span>
          </label>
          <label class="field">
            <span>密码</span>
            <span class="input-wrap">
              <svg class="input-icon" aria-hidden="true"><use href="#icon-lock"></use></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="icon-button input-action" type="button" id="toggle-password" aria-label="显示密码">
                <svg><use href="#icon-eye"></use></svg>
              </button>
            </span>
          </label>
          <div id="login-error" class="form-error" role="alert" hidden></div>
          <button class="button button--primary" id="login-button" type="submit">
            <span>登录控制台</span>
            <svg><use href="#icon-arrow"></use></svg>
          </button>
        </form>

        <p class="login-hint">首次启动密码会输出在服务端终端中。</p>
      </div>
    </section>
  </main>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-user" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>
  <script src="{{ url_for('static', filename='login.js') }}" defer></script>
</body>
</html>
